name: Binance API Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Binance Price ==="
          curl -s --max-time 10 "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT" || echo "FAILED"
          echo ""
          echo "=== Binance HTTP ==="
          curl -s --max-time 10 -o /dev/null -w "HTTP %{http_code}" "https://api.binance.com/api/v3/ping" || echo "FAILED"
          echo ""
          echo "=== OKX (baseline) ==="
          curl -s --max-time 10 "https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'OKX BTC: \${float(d[\"data\"][0][\"last\"])}')"
          echo ""
          echo "=== Runner IP ==="
          curl -s --max-time 5 ifconfig.me
          echo ""
